<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; width: 240px; margin: 0; padding: 14px; color: #222; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .count { font-size: 28px; font-weight: 600; }
    .muted { color: #666; font-size: 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
    button { width: 100%; margin-top: 12px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; background: #f6f6f6; cursor: pointer; font: inherit; }
    button:hover { background: #eee; }
    button:disabled { cursor: default; opacity: .6; }
    #host { word-break: break-all; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>BlockThem</h1>
  <div class="count" id="count">0</div>
  <div class="muted">requests blocked on this tab</div>

  <div class="row">
    <label for="enabled">Blocking enabled</label>
    <input type="checkbox" id="enabled">
  </div>

  <button id="site">Pause on this site</button>
  <div class="muted" id="host"></div>

  <script src="popup.js"></script>
</body>
</html>
